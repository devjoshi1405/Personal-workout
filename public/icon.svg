<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle outer border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Dumbbell Shaft -->
  <rect x="140" y="240" width="232" height="32" rx="16" fill="url(#blue)"/>

  <!-- Dumbbell Left Weight Plates -->
  <rect x="100" y="160" width="36" height="192" rx="12" fill="url(#blue)"/>
  <rect x="68" y="196" width="28" height="120" rx="8" fill="#0284c7"/>

  <!-- Dumbbell Right Weight Plates -->
  <rect x="376" y="160" width="36" height="192" rx="12" fill="url(#blue)"/>
  <rect x="416" y="196" width="28" height="120" rx="8" fill="#0284c7"/>

  <!-- Marigold Gold Sprout / Protein Core Emblem -->
  <circle cx="256" cy="256" r="48" fill="#0b1329" stroke="url(#gold)" stroke-width="8"/>
  <path d="M256 226 C270 240, 276 256, 256 276 C236 256, 242 240, 256 226 Z" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="4" fill="#ffffff"/>
</svg>
